name: Build

on:
  push:
    branches:
      - main

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disable shallow clones for accurate analysis

      # 1. Set up Flutter so the scanner can locate Dart dependencies
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 2. Retrieve Flutter packages (required for accurate Dart analysis)
      - name: Get dependencies
        run: flutter pub get

      # 3. Scan with the official SonarQube CLI Action
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}