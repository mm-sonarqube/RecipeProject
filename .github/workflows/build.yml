name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test-scan:
    name: Build, Test & Scan
    runs-on: [self-hosted, Windows, X64]
    steps:
      # 1. Checkout the code with full history for SonarQube to track blame/authorship
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install project packages
      - name: Install Dependencies
        run: flutter pub get

      # 3. Run tests and export lcov.info
      - name: Run Tests with Coverage
        run: flutter test --coverage

      # 4. Execute the scan using your dedicated local E:\ SonarQube installation
      - name: Run SonarQube Scan
        run: E:\sonarqube-26.7.0.124771\bin\sonar-scanner.bat -Dsonar.token="${{ secrets.SONAR_TOKEN }}" -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}"
        shell: cmd

      # 5. Build the release APK
      - name: Build APK
        run: flutter build apk --release

      # 6. Upload APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30