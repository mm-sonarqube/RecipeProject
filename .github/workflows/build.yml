name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test-scan:
    name: Build, Test & Scan
    runs-on: [self-hosted, Windows, X64]
    steps:
      # 1. Checkout the code with full history for SonarQube to track blame/authorship
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install project packages
      - name: Install Dependencies
        run: flutter pub get

      # 3. Run tests and export lcov.info
      - name: Run Tests with Coverage
        run: flutter test --coverage

      # 4. Cache and run SonarQube Scan natively on Windows
      - name: Cache SonarQube Scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: sonar-scanner
          key: ${{ runner.os }}-sonar-scanner-6.2.1.4610-x64
          restore-keys: |
            ${{ runner.os }}-sonar-scanner-

      # 5. Download and extract the scanner if it's missing from the cache
      - name: Download SonarScanner if not cached
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          Write-Host "Downloading SonarScanner..."
          Invoke-WebRequest -Uri "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-windows-x64.zip" -OutFile "sonar-scanner.zip"
          Write-Host "Extracting SonarScanner..."
          Expand-Archive -Path "sonar-scanner.zip" -DestinationPath "sonar-scanner-temp"
          Move-Item -Path "sonar-scanner-temp/sonar-scanner-*-windows-x64" -Destination "sonar-scanner"
          Remove-Item -Path "sonar-scanner-temp" -Recurse -Force
          Remove-Item -Path "sonar-scanner.zip" -Force
        shell: powershell

      # 6. Execute the scan using explicit relative paths on a single line to prevent parsing bugs
      - name: Run SonarQube Scan
        run: .\sonar-scanner\bin\sonar-scanner.bat -Dsonar.token="${{ secrets.SONAR_TOKEN }}" -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}"
        shell: powershell

      # 7. Build the release APK
      - name: Build APK
        run: flutter build apk --release

      # 8. Upload APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30