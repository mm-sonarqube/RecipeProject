name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test-scan:
    name: Build, Test & Scan
    runs-on: [self-hosted, Windows, X64]
    steps:
      # 1. Checkout the code with full history for SonarQube to track blame/authorship
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # 4. Install project packages
      - name: Install Dependencies
        run: flutter pub get

      # 5. Run tests and export lcov.info
      - name: Run Tests with Coverage
        run: flutter test --coverage

      # 6. SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 7. Build the release APK
      - name: Build APK
        run: flutter build apk --release

      # 8. Upload APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30