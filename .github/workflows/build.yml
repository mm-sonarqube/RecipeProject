name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: Build, Test & Scan
    runs-on: [self-hosted]

    steps:
      # 1. Checkout the code with full history for SonarQube to track blame/authorship
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Java (required by the SonarScanner runner)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Install project packages
      - name: Install Dependencies
        run: flutter pub get

      # 5. Run tests and export lcov.info file
      - name: Run Tests with Coverage
        run: flutter test --coverage

      # 6. Execute the SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # Leave this line out if you are using SonarCloud