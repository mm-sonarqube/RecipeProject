name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test-scan:
    name: Build, Test & Scan
    runs-on: [self-hosted, Windows, X64]
    steps:
      # 1. Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install project packages
      - name: Install Dependencies
        run: flutter pub get

      # 3. Run tests and export lcov.info
      - name: Run Tests with Coverage
        run: flutter test --coverage

      # 4. Download and unzip the clean Scanner CLI tool automatically
      - name: Download SonarScanner CLI
        run: |
          Write-Host "Downloading the scanner tool..."
          Invoke-WebRequest -Uri "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-windows-x64.zip" -OutFile "sonar-scanner.zip"
          Expand-Archive -Path "sonar-scanner.zip" -DestinationPath "sonar-scanner-temp"
          Move-Item -Path "sonar-scanner-temp/sonar-scanner-*-windows-x64" -Destination "my-scanner"
          Remove-Item -Path "sonar-scanner-temp" -Recurse -Force
          Remove-Item -Path "sonar-scanner.zip" -Force
        shell: powershell

      # 5. Run the scan using the exact local folder we just downloaded
      - name: Run SonarQube Scan
        run: my-scanner\bin\sonar-scanner.bat -Dsonar.token="${{ secrets.SONAR_TOKEN }}" -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}"
        shell: cmd

   
      # 6. Build the release APK
      - name: Build APK
        run: flutter build apk --release

      # 7. Upload APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30