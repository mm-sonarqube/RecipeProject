name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test-scan:
    name: Build, Test & Scan
    runs-on: [self-hosted, Windows, X64]
    steps:
      # 1. Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install project packages
      - name: Install Dependencies
        run: flutter pub get

      # 3. Run tests and export lcov.info
      - name: Run Tests with Coverage
        run: flutter test --coverage

      # 4. Generate native Flutter Analysis and translate to generic Sonar layout
      - name: Generate Lint Issues Report
        run: |
          Write-Host "Running native Flutter analysis..."
          # Run analysis safely so exit codes don't trip the engine early
          $proc = Start-Process flutter -ArgumentList "analyze --machine" -NoNewWindow -PassThru -RedirectStandardOutput "flutter-analysis.json"
          $proc.WaitForExit()
          
          if (Test-Path "flutter-analysis.json") {
              $raw = Get-Content "flutter-analysis.json" -Raw
              if ($raw -match "\[.*\]") {
                  $data = ConvertFrom-Json $Matches[0]
                  $sonarIssues = @()
          
                  foreach ($item in $data) {
                      $sev = "INFO"
                      if ($item.severity -eq "WARNING") { $sev = "MAJOR" }
                      if ($item.severity -eq "ERROR") { $sev = "CRITICAL" }
          
                      # Re-map workspace paths safely into clean relative URLs
                      $relativeFile = $item.location.file.Replace("$pwd\", "").Replace("\", "/")
          
                      $sonarIssues += @{
                          engineId = "flutter-linter"
                          ruleId = $item.code
                          severity = $sev
                          type = "CODE_SMELL"
                          primaryLocation = @{
                              message = $item.problemMessage
                              filePath = $relativeFile
                              textRange = @{
                                  startLine = [int]$item.location.line
                                  startColumn = [int]$item.location.column
                                  endLine = [int]$item.location.line
                                  endColumn = [int]($item.location.column + $item.location.length)
                              }
                          }
                      }
                  }
                  @{ issues = $sonarIssues } | ConvertTo-Json -Depth 10 | Set-Content "sonar-issues.json"
              } else {
                  @{ issues = @() } | ConvertTo-Json | Set-Content "sonar-issues.json"
              }
          }
        shell: powershell

      # 5. Download the latest modern Scanner CLI tool
      - name: Download SonarScanner CLI
        run: |
          Write-Host "Downloading the scanner tool..."
          if (Test-Path "my-scanner") { Remove-Item -Path "my-scanner" -Recurse -Force }
          if (Test-Path "sonar-scanner-temp") { Remove-Item -Path "sonar-scanner-temp" -Recurse -Force }
          
          Invoke-WebRequest -Uri "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-windows-x64.zip" -OutFile "sonar-scanner.zip"
          Expand-Archive -Path "sonar-scanner.zip" -DestinationPath "sonar-scanner-temp"
          
          $extractedFolder = Get-ChildItem -Path "sonar-scanner-temp" | Select-Object -First 1
          Move-Item -Path $extractedFolder.FullName -Destination "my-scanner"
          
          Remove-Item -Path "sonar-scanner.zip" -Force
          Remove-Item -Path "sonar-scanner-temp" -Recurse -Force
        shell: powershell

      # 6. Run the Scan using the imported externalIssuesReportPaths flag
      - name: Run SonarQube Scan
        run: |
          & "my-scanner\bin\sonar-scanner.bat" `
            "-Dsonar.token=${{ secrets.SONAR_TOKEN }}" `
            "-Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}" `
            "-Dsonar.externalIssuesReportPaths=sonar-issues.json"
        shell: powershell

      # 7. Build the release APK
      - name: Build APK
        run: flutter build apk --release

      # 8. Upload APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30