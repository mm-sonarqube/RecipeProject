name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test-scan:
    name: Build, Test & Scan
    runs-on: [self-hosted, Windows, X64]
    steps:
      # 1. Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install project packages
      - name: Install Dependencies
        run: flutter pub get

      # 3. Run tests and export lcov.info
      - name: Run Tests with Coverage
        run: flutter test --coverage

      # 4. Download and unzip a COMPATIBLE Scanner CLI tool (v5.0.1) for the Community Plugin
      - name: Download SonarScanner CLI
        run: |
          Write-Host "Downloading the scanner tool..."
          # Clean up old installations if they exist from a previous failed run
          if (Test-Path "my-scanner") { Remove-Item -Path "my-scanner" -Recurse -Force }
          if (Test-Path "sonar-scanner-temp") { Remove-Item -Path "sonar-scanner-temp" -Recurse -Force }
          
          # Using 5.0.1.3006 to maintain compatibility with the community plugin
          Invoke-WebRequest -Uri "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-windows.zip" -OutFile "sonar-scanner.zip"
          Expand-Archive -Path "sonar-scanner.zip" -DestinationPath "sonar-scanner-temp"
          
          # Move the nested folder out and clean up zip resources
          $extractedFolder = Get-ChildItem -Path "sonar-scanner-temp" | Select-Object -First 1
          Move-Item -Path $extractedFolder.FullName -Destination "my-scanner"
          
          Remove-Item -Path "sonar-scanner.zip" -Force
          Remove-Item -Path "sonar-scanner-temp" -Recurse -Force
        shell: powershell

      # 5. Run the scan using PowerShell with fully quoted arguments to prevent parameter splitting
      - name: Run SonarQube Scan
        run: |
          & "my-scanner\bin\sonar-scanner.bat" "-Dsonar.token=${{ secrets.SONAR_TOKEN }}" "-Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}"
        shell: powershell

      # 6. Build the release APK
      - name: Build APK
        run: flutter build apk --release

      # 7. Upload APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30